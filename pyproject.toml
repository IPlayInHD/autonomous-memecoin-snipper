[project]
name = "memecoin-sniper-lab"
version = "0.1.0"
description = "Paper-first Solana memecoin sniping research instrument. Expected EV: negative. Purpose: measure it."
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "base58>=2.1",
    "solders>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sniper*"]
